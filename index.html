const stage=document.getElementById('stage'),viewport=document.getElementById('viewport'),modal=document.getElementById('mediaModal'),modalBody=document.getElementById('modalBody');
let current=1,activeVideo=null;
function fit(){const scale=Math.max(.22,Math.min((innerWidth-24)/portfolio.width,(innerHeight-78)/portfolio.height,1.4));viewport.style.width=portfolio.width*scale+'px';viewport.style.height=portfolio.height*scale+'px';stage.style.transform=`scale(${scale})`;}
function mediaClose(){if(activeVideo){activeVideo.pause();activeVideo.removeAttribute('src');activeVideo.load();activeVideo=null}modalBody.replaceChildren();if(modal.open)modal.close();document.getElementById('modalControls').hidden=true;}
function zoom(src,alt){mediaClose();document.getElementById('modalTitle').textContent=alt||'Project visual';const im=new Image();im.src=src;im.alt=alt||'Original project visual';modalBody.append(im);document.getElementById('modalNote').textContent='Original visual extracted from the supplied project presentation.';modal.showModal();}
function playClip(id){const v=portfolio.videos.find(v=>v.id===Number(id));if(!v)return;mediaClose();document.getElementById('modalTitle').textContent=v.title;const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.poster=v.poster;video.src=v.src;video.loop=document.getElementById('loopVideo').checked;activeVideo=video;modalBody.append(video);document.getElementById('modalNote').textContent=v.note;document.getElementById('modalControls').hidden=false;modal.showModal();video.play().catch(()=>{});}
function openResume(){mediaClose();document.getElementById('modalTitle').textContent='Cadenn Clower / Resume';const u=portfolio.resume;const im=new Image();im.src=portfolio.resumePreview;im.alt='Cadenn Clower resume';modalBody.append(im);const note=document.getElementById('modalNote');note.replaceChildren();for(const [label,download] of [['Open resume PDF',false],['Download resume PDF',true]]){const a=document.createElement('a');a.href=u;a.textContent=label;a.style.cssText='display:inline-block;margin-right:22px;color:#b53565;font-weight:600';if(download)a.download='Cadenn_Clower_Resume.pdf';else{a.target='_blank';a.rel='noopener'}note.append(a)}modal.showModal();}
function show(n){current=Math.min(portfolio.slides.length,Math.max(1,Number(n)||1));const sl=portfolio.slides[current-1];stage.replaceChildren();stage.setAttribute('aria-label',`${current}. ${sl.title.replaceAll('\n',' ')||'Cover'}`);document.getElementById('pageCount').textContent=`${String(current).padStart(2,'0')} / ${portfolio.slides.length}`;
for(const e of sl.elements){let node;if(e.type==='text'){node=document.createElement('div');node.className='element txt';node.textContent=e.text;const family=e.font.endsWith(' Bold')?e.font.slice(0,-5):e.font;node.style.fontFamily=`"${family}",Arial,sans-serif`;node.style.fontSize=e.size+'px';node.style.fontWeight=e.bold?'700':'400';node.style.color=e.color;node.style.height=e.h+'px';}
else if(e.type==='rect'){node=document.createElement('div');node.className='element';node.style.background=e.fill;node.style.borderRadius=(e.radius||0)+'px';node.style.opacity=e.alpha??1;node.style.height=e.h+'px';}
else if(e.type==='line'){node=document.createElement('div');node.className='element';const dx=e.x2-e.x1,dy=e.y2-e.y1;node.style.left=e.x1+'px';node.style.top=e.y1+'px';node.style.width=Math.hypot(dx,dy)+'px';node.style.height=e.width+'px';node.style.background=e.color;node.style.transformOrigin='0 0';node.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;stage.append(node);continue;}
else if(e.type==='image'){node=document.createElement('img');node.className='element visual';node.src=e.src;node.alt=e.alt;node.style.height=e.h+'px';node.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();zoom(e.src,e.alt)}});}
if(node){node.style.left=e.x+'px';node.style.top=e.y+'px';node.style.width=e.w+'px';stage.append(node)}}
for(const a of sl.links){const node=document.createElement('a');node.className='hit';node.style.left=a.x+'px';node.style.top=a.y+'px';node.style.width=a.w+'px';node.style.height=a.h+'px';node.setAttribute('aria-label',a.label||a.kind);node.href=a.kind==='page'?'#p-'+a.target:a.kind==='video'?'#clip-'+a.target:a.target;if(a.kind==='resume'){node.href='#resume';node.addEventListener('click',ev=>{ev.preventDefault();openResume()})}if(a.kind==='url'&&a.target.startsWith('https://')){node.target='_blank';node.rel='noopener noreferrer'}const span=document.createElement('span');span.className='sr';span.textContent=a.label||a.kind;node.append(span);if(a.kind==='video')node.addEventListener('click',ev=>{if(location.hash==='#clip-'+a.target){ev.preventDefault();playClip(a.target)}});stage.append(node)}fit();}
function route(){const h=location.hash;if(h.startsWith('#clip-')){show(18);playClip(h.slice(6))}else{mediaClose();show(h.startsWith('#p-')?h.slice(3):1)}}

window.addEventListener('resize',fit);window.addEventListener('hashchange',route);window.addEventListener('keydown',ev=>{if(modal.open)return;if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();location.hash='p-'+Math.min(24,Math.max(1,current+(ev.key==='ArrowRight'?1:-1)))}if(ev.key==='Home')location.hash='p-1'});route();
